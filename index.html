<!DOCTYPE html>
<html lang="ja">
<head>

  <style>
    :root {
      --primary: #003087;
      --primary-light: #1a4fa3;
      --accent: #0072CE;
      --bg: #f4f7fb;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-light: #555b6e;
      --border: #dce3ef;
      --progrit: #ffa500;
      --polyglots: #2eab5e;
      --englishcentral: #9b1b30;
      --shadow: 0 2px 16px rgba(0,48,135,0.08);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      background: var(--primary);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      font-size: 0.75rem;
      opacity: 0.85;
      border-right: 1px solid rgba(255,255,255,0.35);
      padding-right: 12px;
      letter-spacing: 0.05em;
    }
    .header-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px 60px;
    }

    /* ====== START SCREEN ====== */
    .screen { display: none; }
    .screen.active { display: block; }

    .start-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      text-align: center;
    }
    .start-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    .start-card h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .start-card .lead {
      color: var(--text-light);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .badge-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .badge {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 0.8rem;
      color: var(--text-light);
    }
    .btn-start {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 15px 48px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 18px rgba(0,48,135,0.22);
    }
    .btn-start:hover { background: var(--primary-light); transform: translateY(-1px); }
    .company-logos {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .co-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
    }
    .co-chip.progrit { background: var(--progrit); }
    .co-chip.polyglots { background: var(--polyglots); }
    .co-chip.ec { background: var(--englishcentral); }

    /* ====== QUESTION SCREEN ====== */
    .q-progress-wrap {
      margin-bottom: 24px;
    }
    .q-progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 7px;
    }
    .q-progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .q-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.4s ease;
    }
    .q-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px 28px;
    }
    .q-number {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .q-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 24px;
      line-height: 1.5;
    }

      flex-direction: column;
      gap: 11px;
    }
    .option-btn {

      align-items: flex-start;
      gap: 12px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      text-align: left;
      font-size: 0.95rem;
      color: var(--text);

      line-height: 1.5;
      font-family: inherit;

      border-color: var(--primary);
      background: #e8eef8;
      color: var(--primary);
      font-weight: 600;
    }
    .opt-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-light);
      transition: all 0.18s;
    }
    .option-btn.selected .opt-icon {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .q-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }
    .btn-back {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 8px 4px;
      font-family: inherit;
    }
    .btn-back:hover { color: var(--text); }
    .btn-next {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 11px 36px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, opacity 0.2s;
      letter-spacing: 0.04em;
    }
    .btn-next:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-next:not(:disabled):hover { background: var(--primary-light); }

    /* ====== RESULT SCREEN ====== */
    .result-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .result-header h2 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .result-header p {
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .result-cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border-left: 5px solid var(--border);

    .result-card.rank-2 { border-left-color: #C0C0C0; }
    .result-card.rank-3 { border-left-color: #CD7F32; }
    .result-card-top {
      padding: 20px 22px 16px;
    }
    .rc-rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .rc-rank-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rank-medal {
      font-size: 1.4rem;
    }
    .rank-label {
      font-size: 0.78rem;
      color: var(--text-light);
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .rc-match { text-align: right; }
    .rc-stars-text {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .rc-stars-row {
      display: inline-flex;
      gap: 1px;
      margin-bottom: 3px;
    }
    .star-full, .star-empty { font-size: 1.5rem; line-height: 1; }

    .star-empty { color: #ddd; }
    .star-half-wrap {
      position: relative;
      display: inline-block;
      font-size: 1.5rem;
      line-height: 1;
      color: #ddd;
    }
    .star-half-fill {
      position: absolute;
      left: 0; top: 0;
      color: #FFD700;
      width: 50%;
      overflow: hidden;
      display: block;
      white-space: nowrap;
    }
    .rc-match-label {
      font-size: 0.7rem;
      color: var(--text-light);
      display: block;
      margin-top: 1px;
    }
    .rc-service-info {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .rc-company-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;

    .rc-service-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }
    .rc-tagline {
      font-size: 0.82rem;
      color: var(--text-light);
    }
    .result-card-body {
      border-top: 1px solid var(--border);
      padding: 16px 22px;
    }
    .rc-desc {
      font-size: 0.88rem;
      color: var(--text-light);
      line-height: 1.65;
      margin-bottom: 14px;
    }
    .rc-reasons-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .rc-reasons {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .rc-reasons li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.5;
    }
    .rc-reasons li::before {
      content: "✓";
      color: var(--accent);
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .btn-retry-wrap {
      text-align: center;
      margin-top: 36px;
    }
    .btn-retry {
      display: inline-block;
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: 50px;
      padding: 12px 36px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s;
      letter-spacing: 0.04em;
    }
    .btn-retry:hover { background: var(--primary); color: #fff; }
    .result-note {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-light);
      margin-top: 20px;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      .start-card { padding: 28px 20px; }
      .q-card { padding: 24px 18px 20px; }
      .q-text { font-size: 1rem; }
      .result-card-top, .result-card-body { padding: 16px; }
      .rc-stars-text { font-size: 1rem; }
    }
  </style>
</head>

<header class="header">

<!-- ========== START SCREEN ========== -->

        <div class="co-chip ec">● イングリッシュセントラル</div>

    </div>
  </div>

  <!-- ========== QUESTION SCREEN ========== -->

    <div class="q-progress-wrap">
      <div class="q-progress-label">
        <span id="q-progress-text">Question 1 / 8</span>
        <span id="q-progress-pct">0%</span>

    </div>
    <div class="btn-retry-wrap">
      <button class="btn-retry" onclick="resetQuiz()">もう一度診断する</button>
    </div>
  </div>
</div>

// ============================================================
//  STATE
// ============================================================
let currentQ = 0;
let answers = questions.map(q => q.multiSelect ? [] : -1);

// ============================================================
//  QUIZ LOGIC
// ============================================================
function startQuiz() {
  currentQ = 0;
  answers = questions.map(q => q.multiSelect ? [] : -1);
  showScreen('screen-question');
  renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const q = questions[currentQ];
  const total = questions.length;

  document.getElementById('q-number').textContent = 'Q' + (currentQ + 1);
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-progress-text').textContent = `Question ${currentQ + 1} / ${total}`;
  document.getElementById('q-progress-pct').textContent = Math.round((currentQ / total) * 100) + '%';
  document.getElementById('q-progress-fill').style.width = (currentQ / total * 100) + '%';

  const optContainer = document.getElementById('q-options');
  optContainer.innerHTML = '';
  if (q.multiSelect) {
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:0.78rem;color:#888;margin-bottom:10px;';
    hint.textContent = '※ 当てはまるものをすべて選択してください';
    optContainer.appendChild(hint);
  }
  q.options.forEach((opt, i) => {
    const isSelected = q.multiSelect ? answers[currentQ].includes(i) : answers[currentQ] === i;
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (isSelected ? ' selected' : '');
    btn.innerHTML = `<span class="opt-icon">${isSelected ? '✓' : String.fromCharCode(65 + i)}</span>${opt}`;
    btn.onclick = () => selectOption(i);
    optContainer.appendChild(btn);
  });

  document.getElementById('btn-back').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
  const hasAnswer = q.multiSelect ? answers[currentQ].length > 0 : answers[currentQ] !== -1;
  document.getElementById('btn-next').disabled = !hasAnswer;
  document.getElementById('btn-next').textContent = currentQ === questions.length - 1 ? '結果を見る →' : '次へ →';
}

function selectOption(i) {
  const q = questions[currentQ];
  if (q.multiSelect) {
    const arr = answers[currentQ];
    const pos = arr.indexOf(i);
    if (pos > -1) arr.splice(pos, 1);
    else arr.push(i);
    // Re-render options to reflect updated selections
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach((btn, idx) => {
      const sel = arr.includes(idx);
      btn.classList.toggle('selected', sel);
      btn.querySelector('.opt-icon').textContent = sel ? '✓' : String.fromCharCode(65 + idx);
    });
    document.getElementById('btn-next').disabled = arr.length === 0;
  } else {
    answers[currentQ] = i;
    document.querySelectorAll('.option-btn').forEach((btn, idx) => {
      btn.classList.toggle('selected', idx === i);
      btn.querySelector('.opt-icon').textContent = idx === i ? '✓' : String.fromCharCode(65 + idx);
    });
    document.getElementById('btn-next').disabled = false;
  }
}

function nextQuestion() {
  const q = questions[currentQ];
  const hasAnswer = q.multiSelect ? answers[currentQ].length > 0 : answers[currentQ] !== -1;
  if (!hasAnswer) return;
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

//  SCORING & RESULTS
// ============================================================
function computeScores() {
  const totals = new Array(services.length).fill(0);
  answers.forEach((ans, qIdx) => {
    if (Array.isArray(ans)) {
      ans.forEach(a => {
        scores[qIdx][a].forEach((pts, sIdx) => { totals[sIdx] += pts; });
      });
    } else {
      if (ans < 0) return;
      scores[qIdx][ans].forEach((pts, sIdx) => { totals[sIdx] += pts; });
    }
  });
  return totals;
}

function getUserTags() {
  const tags = new Set();
  answers.forEach((ans, qIdx) => {
    if (Array.isArray(ans)) {
      ans.forEach(a => { (questions[qIdx].tags[a] || []).forEach(t => tags.add(t)); });
    } else if (ans >= 0) {
      (questions[qIdx].tags[ans] || []).forEach(t => tags.add(t));
    }
  });
  return tags;
}

function getReasons(service, userTags) {
  // Find dynamic reasons with matching tags
  const dynamic = service.reasons.filter(r => !r._default && r.tags.some(t => userTags.has(t)));
  const defaults = service.reasons.filter(r => r._default);
  const merged = [...dynamic, ...defaults];
  // Deduplicate and return top 2
  const seen = new Set();
  const result = [];
  for (const r of merged) {
    if (!seen.has(r.text)) {
      seen.add(r.text);
      result.push(r.text);
      if (result.length >= 2) break;
    }
  }
  return result;
}

function renderStars(stars) {
  let html = '<span class="rc-stars-row">';
  for (let i = 1; i <= 5; i++) {
    if (stars >= i) {
      html += '<span class="star-full">★</span>';
    } else if (stars >= i - 0.5) {
      html += '<span class="star-half-wrap">★<span class="star-half-fill">★</span></span>';
    } else {
      html += '<span class="star-empty">★</span>';
    }
  }
  html += '</span>';
  return html;
}

function toStars(score, maxScore) {
  if (maxScore === 0) return 3.0;
  const ratio = score / maxScore;
  return Math.max(2.5, Math.round((2.5 + ratio * 2.5) * 2) / 2);
}

function showResults() {
  const rawScores = computeScores();
  const userTags = getUserTags();

  // Build ranked list from raw scores (no artificial boost)
  let ranked = services.map((s, i) => ({
    index: i,
    score: rawScores[i]
  })).sort((a, b) => b.score - a.score);

  // Constraint 1: ProGrit must be in top 2
  const hasProgritInTop2 = ranked.slice(0, 2).some(r => services[r.index].isProgrit);
  if (!hasProgritInTop2) {
    const pgIdx = ranked.findIndex((r, i) => i >= 2 && services[r.index].isProgrit);
    if (pgIdx > -1) {
      const pg = ranked.splice(pgIdx, 1)[0];
      // Insert at position 1 (rank 2) with a score between #1 and #3
      pg.score = Math.floor((ranked[0].score + ranked[1].score) / 2);
      ranked.splice(1, 0, pg);
    }
  }

  // Constraint 2: If user selected リスニング (Q4 index 1), シャドテン (services[2]) must be in top 2
  const skillAnswers = answers[3]; // Q4 is index 3
  const wantsListening = Array.isArray(skillAnswers) && skillAnswers.includes(1);
  if (wantsListening) {
    const shadotenInTop2 = ranked.slice(0, 2).some(r => r.index === 2);
    if (!shadotenInTop2) {
      const shadotenIdx = ranked.findIndex(r => r.index === 2);
      if (shadotenIdx > -1) {
        const shadoten = ranked.splice(shadotenIdx, 1)[0];
        shadoten.score = Math.floor((ranked[0].score + ranked[1].score) / 2);
        ranked.splice(1, 0, shadoten);
      }
    }
  }

  // Constraint 3: Ensure top 3 has services from at least 2 different companies
  const top3Companies = () => new Set(ranked.slice(0, 3).map(r => services[r.index].companyClass));
  if (top3Companies().size === 1) {
    // All top 3 from same company — find best service from another company
    const altIdx = ranked.findIndex((r, i) => i >= 3 && services[r.index].companyClass !== services[ranked[0].index].companyClass);
    if (altIdx > -1) {
      const alt = ranked.splice(altIdx, 1)[0];
      ranked.splice(2, 1, alt); // replace #3
      ranked.sort((a, b) => b.score - a.score).slice(); // re-sort top portion
    }
  }

  const top3 = ranked.slice(0, 3);
  const maxScore = ranked[0].score;
  const medals = ['🥇', '🥈', '🥉'];
  const rankLabels = ['1位 おすすめ', '2位', '3位'];

  const container = document.getElementById('result-cards');
  container.innerHTML = '';

  top3.forEach((item, rank) => {
    const svc = services[item.index];
    const stars = [5.0, 4.5, 4.0][rank];
    const reasons = getReasons(svc, userTags);
    const accentColor = { progrit: '#ffa500', polyglots: '#2eab5e', ec: '#9b1b30' }[svc.companyClass];

    const card = document.createElement('div');
    card.className = `result-card rank-${rank + 1}`;
    card.innerHTML = `
      <div class="result-card-top">
        <div class="rc-rank-row">
          <div class="rc-rank-badge">
            <span class="rank-medal">${medals[rank]}</span>
            <span class="rank-label">${rankLabels[rank]}</span>
          </div>
          <div class="rc-match">
            <div class="rc-stars-text" style="color:${accentColor}">${stars.toFixed(1)} / 5.0</div>
            ${renderStars(stars)}
            <span class="rc-match-label">マッチ度</span>
          </div>
        </div>
        <div class="rc-service-info">
          <span class="rc-company-badge ${svc.companyClass}">${svc.company}</span>
          <div>
            <div class="rc-service-name">${svc.name}</div>
            <div class="rc-tagline">${svc.tagline}</div>
          </div>
        </div>
      </div>
      <div class="result-card-body">
        <div class="rc-desc">${svc.description}</div>
        <div class="rc-reasons-title">▶ おすすめの理由</div>
        <ul class="rc-reasons">
          ${reasons.map(r => `<li>${r}</li>`).join('')}
        </ul>
      </div>
    `;
    container.appendChild(card);
  });

  showScreen('screen-result');
}

function resetQuiz() {
  currentQ = 0;
  answers = questions.map(q => q.multiSelect ? [] : -1);
  showScreen('screen-start');
}
</script>
